# ==========================================
# BookFlow Application Configuration
# ==========================================

# Application
spring.application.name=BookFlow
server.port=8080

# ==========================================
# Database - MySQL
# ==========================================
# Update username and password to match your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/bookflow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${BOOKFLOW_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
# update: creates/alters tables to match entities on startup (development mode)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Thymeleaf
# ==========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ==========================================
# File Upload
# ==========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Uploaded files are stored outside the public web directory
bookflow.upload.dir=uploads

# ==========================================
# Email — Gmail API + OAuth 2.0
# ==========================================
# SMTP is NOT used. BookFlow sends email via the Gmail REST API
# using an OAuth 2.0 "installed application" credential.
#
# First-run authorization:
#   Start the app and register a user. The server will print an
#   authorization URL to the console. Open it in a browser, grant
#   access, and the token will be saved to bookflow.gmail.tokens-dir.
#   Subsequent runs reuse the saved token automatically.
#
# Path to the Google OAuth client JSON downloaded from Google Cloud Console.
bookflow.gmail.credentials-file=secrets/google-oauth-client.json

# Directory where the authorized access/refresh token will be stored.
# Kept outside src/ so it is never packaged into the JAR or committed.
bookflow.gmail.tokens-dir=secrets/tokens

# Gmail address used as the "From" address.
# Must match the Gmail account you authorize during the first-run flow.
bookflow.mail.from=upadhyayyuvraj68@gmail.com

# Base URL used in verification links — change to your public URL before deployment.
bookflow.app.base-url=http://localhost:8080

# Verification token validity period in hours (default: 24)
bookflow.verification.token-expiry-hours=24

# ==========================================
# Logging
# ==========================================
logging.level.com.bookflow=DEBUG
logging.level.org.springframework.web=INFO
