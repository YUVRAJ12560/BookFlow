<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BookFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg bf-navbar">
    <div class="container">
        <a class="bf-brand" th:href="@{/}">
            <span class="bf-brand-icon"><i class="bi bi-book-half"></i></span>
            BookFlow
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a class="bf-nav-btn bf-nav-btn-outline" th:href="@{/login}">Login</a>
            <a class="bf-nav-btn bf-nav-btn-solid" th:href="@{/register}">Register</a>
        </div>
    </div>
</nav>

<!-- ── Main ────────────────────────────────────────────────── -->
<div class="bf-auth-wrap" style="align-items:flex-start;padding:1.75rem 0 2.5rem;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-11 col-md-8 col-lg-6 col-xl-5">

                <div class="text-center mb-3">
                    <div class="bf-brand-icon mx-auto mb-2" style="width:42px;height:42px;font-size:1.2rem;">
                        <i class="bi bi-book-half"></i>
                    </div>
                    <h1 class="h4 fw-bold mb-1">Create your account</h1>
                    <p class="text-muted" style="font-size:.85rem;">
                        Only <strong>@pvppcoe.ac.in</strong> email addresses are accepted.
                    </p>
                </div>

                <div class="bf-card">
                    <div class="bf-card-body">

                        <!-- Server-side errors -->
                        <div th:if="${domainError}"
                             class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
                            <i class="bi bi-x-circle-fill flex-shrink-0"></i>
                            <span th:text="${domainError}"></span>
                        </div>
                        <div th:if="${emailError}"
                             class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
                            <i class="bi bi-x-circle-fill flex-shrink-0"></i>
                            <span th:text="${emailError}"></span>
                        </div>
                        <div th:if="${passwordMismatch}"
                             class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
                            <i class="bi bi-x-circle-fill flex-shrink-0"></i>
                            <span th:text="${passwordMismatch}"></span>
                        </div>

                        <!-- th:object, th:field, th:errors, th:classappend preserved exactly -->
                        <form th:action="@{/register}" th:object="${registerDto}"
                              method="post" novalidate id="registerForm">

                            <!-- Full Name -->
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" id="name" th:field="*{name}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"
                                       placeholder="Your full name" autocomplete="name">
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('name')}"
                                     th:errors="*{name}"></div>
                            </div>

                            <!-- College Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">College Email</label>
                                <input type="email" id="email" th:field="*{email}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
                                       placeholder="yourname@pvppcoe.ac.in"
                                       autocomplete="email"
                                       pattern="^[a-zA-Z0-9._%+\-]+@pvppcoe\.ac\.in$"
                                       title="Only @pvppcoe.ac.in email addresses are accepted">
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}"></div>
                                <div class="form-text">Must end with @pvppcoe.ac.in</div>
                            </div>

                            <!-- Password row -->
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" id="password" th:field="*{password}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'"
                                           placeholder="Min 8 characters"
                                           autocomplete="new-password">
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('password')}"
                                         th:errors="*{password}"></div>
                                </div>
                                <div class="col-6">
                                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                                    <input type="password" id="confirmPassword"
                                           th:field="*{confirmPassword}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('confirmPassword')} ? ' is-invalid'"
                                           placeholder="Repeat password"
                                           autocomplete="new-password">
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('confirmPassword')}"
                                         th:errors="*{confirmPassword}"></div>
                                </div>
                            </div>

                            <!-- Academic profile — th:field preserved -->
                            <div class="bf-section-label mb-2">Academic Profile</div>
                            <div class="row g-3 mb-4">
                                <div class="col-6">
                                    <label for="year" class="form-label">
                                        Current Year <span class="text-danger">*</span>
                                    </label>
                                    <select id="year" th:field="*{year}"
                                            class="form-select"
                                            th:classappend="${#fields.hasErrors('year')} ? ' is-invalid'">
                                        <option value="">-- Year --</option>
                                        <option value="1">Year 1</option>
                                        <option value="2">Year 2</option>
                                        <option value="3">Year 3</option>
                                        <option value="4">Year 4</option>
                                    </select>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('year')}"
                                         th:errors="*{year}"></div>
                                </div>
                                <div class="col-6">
                                    <label for="semester" class="form-label">
                                        Semester <span class="text-danger">*</span>
                                    </label>
                                    <select id="semester" th:field="*{semester}"
                                            class="form-select"
                                            th:classappend="${#fields.hasErrors('semester')} ? ' is-invalid'">
                                        <option value="">-- Sem --</option>
                                        <option th:each="s : ${#numbers.sequence(1,8)}"
                                                th:value="${s}"
                                                th:text="'Sem ' + ${s}"></option>
                                    </select>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('semester')}"
                                         th:errors="*{semester}"></div>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-person-check me-1"></i> Create Account
                                </button>
                            </div>
                        </form>

                        <div class="bf-divider-text mt-4">or</div>
                        <p class="text-center mb-0" style="font-size:.85rem;">
                            Already have an account?
                            <a th:href="@{/login}" class="fw-600">Sign in</a>
                        </p>

                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- ── Footer ──────────────────────────────────────────────── -->
<footer class="bf-footer">
    <div class="container text-center">
        &copy; 2026 BookFlow &mdash; PVPP College of Engineering
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmQ5R6BaOqDM/N7mOLGSMd/oG9iy" crossorigin="anonymous"></script>
<script th:src="@{/js/main.js}"></script>

<!-- Frontend domain validation (backend always re-validates) -->
<script>
    document.getElementById('registerForm').addEventListener('submit', function (e) {
        const emailInput = document.getElementById('email');
        const emailVal = emailInput.value.trim().toLowerCase();
        const allowed = '@pvppcoe.ac.in';
        if (!emailVal.endsWith(allowed) ||
                emailVal.indexOf('@') !== emailVal.lastIndexOf('@') ||
                emailVal === allowed) {
            emailInput.setCustomValidity('Only @pvppcoe.ac.in email addresses are accepted.');
            emailInput.reportValidity();
            e.preventDefault();
        } else {
            emailInput.setCustomValidity('');
        }
    });
</script>
</body>
</html>
