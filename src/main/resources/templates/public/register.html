<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BookFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<!-- ── Navbar ────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg bf-navbar">
    <div class="container">
        <a class="bf-brand" th:href="@{/}">
            <span class="bf-brand-icon"><i class="bi bi-book-half"></i></span>
            BookFlow
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a class="bf-nav-btn bf-nav-btn-outline" th:href="@{/login}">Login</a>
            <a class="bf-nav-btn bf-nav-btn-solid" th:href="@{/register}">Register</a>
        </div>
    </div>
</nav>

<!-- ── Page ──────────────────────────────────────────────── -->
<main class="auth-page auth-page--tall">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-10 col-md-8 col-lg-6" style="max-width:480px;">

                <!-- Card header -->
                <div class="auth-header">
                    <div class="auth-header__icon">
                        <i class="bi bi-book-half"></i>
                    </div>
                    <h1 class="auth-header__title">Create your account</h1>
                    <p class="auth-header__sub">
                        Use your college email to join BookFlow
                    </p>
                </div>

                <!-- Card -->
                <div class="auth-card">
                    <div class="auth-card__body">

                        <!-- Status alerts — all Thymeleaf conditions preserved exactly -->
                        <div th:if="${domainError}"
                             class="alert alert-danger d-flex align-items-center gap-2" role="alert">
                            <i class="bi bi-x-circle-fill flex-shrink-0"></i>
                            <span th:text="${domainError}"></span>
                        </div>
                        <div th:if="${emailError}"
                             class="alert alert-danger d-flex align-items-center gap-2" role="alert">
                            <i class="bi bi-x-circle-fill flex-shrink-0"></i>
                            <span th:text="${emailError}"></span>
                        </div>
                        <div th:if="${passwordMismatch}"
                             class="alert alert-danger d-flex align-items-center gap-2" role="alert">
                            <i class="bi bi-x-circle-fill flex-shrink-0"></i>
                            <span th:text="${passwordMismatch}"></span>
                        </div>

                        <!--
                            Hidden form — receives Google ID token and POSTs to backend.
                            CSRF token injected automatically by Thymeleaf + Spring Security.
                        -->
                        <form id="googleAuthFormReg"
                              th:action="@{/auth/google}" method="post"
                              style="display:none;">
                            <input type="hidden" id="googleCredentialReg" name="credential" value="">
                        </form>

                        <!-- Google button — identical structure to login.html -->
                        <div id="googleBtnWrapReg" class="gsi-wrap">
                            <button type="button" class="gsi-btn"
                                    onclick="triggerGoogleSignInReg()">
                                <svg class="gsi-btn__icon" viewBox="0 0 24 24"
                                     xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                                </svg>
                                Continue with Google
                            </button>
                        </div>

                        <div class="auth-divider">or sign up with email</div>

                        <!-- Email registration form — th:object, th:field, th:errors preserved exactly -->
                        <form th:action="@{/register}" th:object="${registerDto}"
                              method="post" novalidate id="registerForm">

                            <!-- Full Name -->
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" id="name" th:field="*{name}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"
                                       placeholder="Your full name"
                                       autocomplete="name">
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('name')}"
                                     th:errors="*{name}"></div>
                            </div>

                            <!-- College Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">College Email</label>
                                <input type="email" id="email" th:field="*{email}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
                                       placeholder="yourname@pvppcoe.ac.in"
                                       autocomplete="email"
                                       pattern="^[a-zA-Z0-9._%+\-]+@pvppcoe\.ac\.in$"
                                       title="Only @pvppcoe.ac.in email addresses are accepted">
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}"></div>
                                <div class="form-text">Must end with @pvppcoe.ac.in</div>
                            </div>

                            <!-- Password row -->
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label for="password" class="form-label">Password</label>
                                    <div class="auth-pass-wrap">
                                        <input type="password" id="password" th:field="*{password}"
                                               class="form-control"
                                               th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'"
                                               placeholder="Min 8 chars"
                                               autocomplete="new-password">
                                        <button type="button"
                                                class="auth-pass-toggle"
                                                aria-label="Toggle password"
                                                onclick="togglePass('password', this)">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('password')}"
                                         th:errors="*{password}"></div>
                                </div>
                                <div class="col-6">
                                    <label for="confirmPassword" class="form-label">Confirm</label>
                                    <div class="auth-pass-wrap">
                                        <input type="password" id="confirmPassword"
                                               th:field="*{confirmPassword}"
                                               class="form-control"
                                               th:classappend="${#fields.hasErrors('confirmPassword')} ? ' is-invalid'"
                                               placeholder="Repeat"
                                               autocomplete="new-password">
                                        <button type="button"
                                                class="auth-pass-toggle"
                                                aria-label="Toggle confirm password"
                                                onclick="togglePass('confirmPassword', this)">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('confirmPassword')}"
                                         th:errors="*{confirmPassword}"></div>
                                </div>
                            </div>

                            <!-- Academic Profile — th:field preserved exactly -->
                            <span class="auth-section-label">Academic Profile</span>
                            <div class="row g-3 mb-4">
                                <div class="col-6">
                                    <label for="year" class="form-label">
                                        Year <span class="text-danger">*</span>
                                    </label>
                                    <select id="year" th:field="*{year}"
                                            class="form-select"
                                            th:classappend="${#fields.hasErrors('year')} ? ' is-invalid'">
                                        <option value="">-- Year --</option>
                                        <option value="1">Year 1</option>
                                        <option value="2">Year 2</option>
                                        <option value="3">Year 3</option>
                                        <option value="4">Year 4</option>
                                    </select>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('year')}"
                                         th:errors="*{year}"></div>
                                </div>
                                <div class="col-6">
                                    <label for="semester" class="form-label">
                                        Semester <span class="text-danger">*</span>
                                    </label>
                                    <select id="semester" th:field="*{semester}"
                                            class="form-select"
                                            th:classappend="${#fields.hasErrors('semester')} ? ' is-invalid'">
                                        <option value="">-- Sem --</option>
                                        <option th:each="s : ${#numbers.sequence(1,8)}"
                                                th:value="${s}"
                                                th:text="'Sem ' + ${s}"></option>
                                    </select>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('semester')}"
                                         th:errors="*{semester}"></div>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-person-check me-1"></i> Create Account
                                </button>
                            </div>

                        </form>

                        <!-- Footer link -->
                        <div class="auth-footer">
                            Already have an account?
                            <a th:href="@{/login}">Sign in &rarr;</a>
                        </div>

                    </div>
                </div><!-- /auth-card -->

            </div>
        </div>
    </div>
</main>

<!-- ── Footer ────────────────────────────────────────────── -->
<footer class="bf-footer" style="padding:0.875rem 0;">
    <div class="container">
        <div class="bf-footer-bottom" style="padding:0.25rem 0;border-top:none;">
            <span>&copy; 2026 BookFlow</span>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmQ5R6BaOqDM/N7mOLGSMd/oG9iy"
        crossorigin="anonymous"></script>
<script th:src="@{/js/main.js}"></script>

<!-- Frontend domain validation — backend always re-validates server-side -->
<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        var emailInput = document.getElementById('email');
        var val        = emailInput.value.trim().toLowerCase();
        var allowed    = '@pvppcoe.ac.in';
        if (!val.endsWith(allowed)
                || val.indexOf('@') !== val.lastIndexOf('@')
                || val === allowed) {
            emailInput.setCustomValidity('Only @pvppcoe.ac.in email addresses are accepted.');
            emailInput.reportValidity();
            e.preventDefault();
        } else {
            emailInput.setCustomValidity('');
        }
    });
</script>

<!-- GIS SDK — identical pattern to login.html -->
<script src="https://accounts.google.com/gsi/client"
        async defer onload="initGoogleSignInReg()"></script>

<script th:inline="javascript">
/*<![CDATA[*/
var _googleClientIdReg = /*[[${googleClientId}]]*/ '';

function _isClientIdValidReg(id) {
    return id
        && id.trim() !== ''
        && !id.startsWith('placeholder')
        && id !== 'REPLACE_WITH_YOUR_WEB_CLIENT_ID';
}

function initGoogleSignInReg() {
    if (!_isClientIdValidReg(_googleClientIdReg)) { return; }

    google.accounts.id.initialize({
        client_id: _googleClientIdReg.trim(),
        callback: function(response) {
            if (response && response.credential) {
                document.getElementById('googleCredentialReg').value = response.credential;
                document.getElementById('googleAuthFormReg').submit();
            }
        }
    });

    var wrap = document.getElementById('googleBtnWrapReg');
    google.accounts.id.renderButton(wrap, {
        theme: 'outline',
        size:  'large',
        text:  'continue_with',
        width: Math.min(wrap.offsetWidth || 440, 440)
    });
    wrap.classList.add('gsi-rendered');
}

function triggerGoogleSignInReg() {
    if (window.google && window.google.accounts && window.google.accounts.id) {
        initGoogleSignInReg();
    }
}

function togglePass(fieldId, btn) {
    var input = document.getElementById(fieldId);
    var icon  = btn.querySelector('i');
    if (input.type === 'password') {
        input.type    = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        input.type    = 'password';
        icon.className = 'bi bi-eye';
    }
}
/*]]>*/
</script>

</body>
</html>
