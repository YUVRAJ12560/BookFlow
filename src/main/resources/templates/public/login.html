<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BookFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg bf-navbar">
    <div class="container">
        <a class="bf-brand" th:href="@{/}">
            <span class="bf-brand-icon"><i class="bi bi-book-half"></i></span>
            BookFlow
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a class="bf-nav-btn bf-nav-btn-outline" th:href="@{/login}">Login</a>
            <a class="bf-nav-btn bf-nav-btn-solid" th:href="@{/register}">Register</a>
        </div>
    </div>
</nav>

<!-- ── Main ────────────────────────────────────────────────── -->
<div class="bf-auth-wrap">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <!-- Header above card -->
                <div class="text-center mb-3">
                    <div class="bf-brand-icon mx-auto mb-2" style="width:42px;height:42px;font-size:1.2rem;">
                        <i class="bi bi-book-half"></i>
                    </div>
                    <h1 class="h4 fw-bold mb-1">Welcome back</h1>
                    <p class="text-muted" style="font-size:.85rem;">Sign in to your BookFlow account</p>
                </div>

                <div class="bf-card">
                    <div class="bf-card-body">

                        <!-- Alerts -->
                        <div th:if="${verificationSuccess}"
                             class="alert alert-success auto-dismiss d-flex align-items-center gap-2"
                             role="alert">
                            <i class="bi bi-check-circle-fill flex-shrink-0"></i>
                            <span th:text="${verificationSuccess}"></span>
                        </div>
                        <div th:if="${registrationSuccess}"
                             class="alert alert-success auto-dismiss d-flex align-items-center gap-2"
                             role="alert">
                            <i class="bi bi-check-circle-fill flex-shrink-0"></i>
                            <span th:text="${registrationSuccess}"></span>
                        </div>
                        <div th:if="${param.error}"
                             class="alert alert-danger d-flex align-items-center gap-2"
                             role="alert">
                            <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                            <span>Incorrect email or password. Please try again.</span>
                        </div>
                        <div th:if="${param.logout}"
                             class="alert alert-info auto-dismiss d-flex align-items-center gap-2"
                             role="alert">
                            <i class="bi bi-box-arrow-left flex-shrink-0"></i>
                            <span>You have been logged out successfully.</span>
                        </div>

                        <!-- Form — name="email" and name="password" are required by Spring Security -->
                        <form th:action="@{/login}" method="post">

                            <div class="mb-3">
                                <label for="email" class="form-label">College Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0" style="border:1.5px solid #e2e8f0;border-right:none;border-radius:6px 0 0 6px;">
                                        <i class="bi bi-envelope text-muted" style="font-size:.85rem;"></i>
                                    </span>
                                    <input type="email" id="email" name="email"
                                           class="form-control border-start-0"
                                           style="border-left:none;"
                                           placeholder="yourname@pvppcoe.ac.in"
                                           autocomplete="email" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0" style="border:1.5px solid #e2e8f0;border-right:none;border-radius:6px 0 0 6px;">
                                        <i class="bi bi-lock text-muted" style="font-size:.85rem;"></i>
                                    </span>
                                    <input type="password" id="password" name="password"
                                           class="form-control border-start-0"
                                           style="border-left:none;"
                                           placeholder="••••••••"
                                           autocomplete="current-password" required>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Sign In <i class="bi bi-arrow-right ms-1"></i>
                                </button>
                            </div>
                        </form>

                        <div class="bf-divider-text mt-4">or</div>

                        <p class="text-center mb-0" style="font-size:.85rem;">
                            Don't have an account?
                            <a th:href="@{/register}" class="fw-600">Create one</a>
                        </p>

                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- ── Footer ──────────────────────────────────────────────── -->
<footer class="bf-footer">
    <div class="container text-center">
        &copy; 2026 BookFlow &mdash; PVPP College of Engineering
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmQ5R6BaOqDM/N7mOLGSMd/oG9iy" crossorigin="anonymous"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
