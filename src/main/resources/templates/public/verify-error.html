<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Failed | BookFlow</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg bf-navbar">
        <div class="container">
            <a class="navbar-brand bf-navbar-brand" th:href="@{/}">
                <i class="bi bi-book-half me-2"></i>BookFlow
            </a>
        </div>
    </nav>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-sm border-danger">
                        <div class="card-body p-4 p-md-5 text-center">

                            <i class="bi bi-x-circle display-4 text-danger mb-3 d-block"></i>
                            <h2 class="h4 fw-bold mb-2">Verification failed</h2>

                            <p class="text-muted mb-4"
                               th:text="${errorMessage} ?: 'This verification link is invalid or has expired.'">
                            </p>

                            <p class="text-muted small mb-4">
                                Verification links are single-use and expire after 24 hours.
                                You can request a new link below.
                            </p>

                            <div class="d-grid gap-2">
                                <a th:href="@{/verify-pending}" class="btn btn-primary">
                                    <i class="bi bi-envelope-arrow-up me-2"></i>Request a New Link
                                </a>
                                <a th:href="@{/register}" class="btn btn-outline-secondary">
                                    <i class="bi bi-person-plus me-2"></i>Register Again
                                </a>
                                <a th:href="@{/login}" class="btn btn-link text-muted">
                                    <i class="bi bi-arrow-left me-1"></i>Back to Login
                                </a>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 BookFlow &mdash; Academic Resource Sharing Platform</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmQ5R6BaOqDM/N7mOLGSMd/oG9iy"
            crossorigin="anonymous"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
