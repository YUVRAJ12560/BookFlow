<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Failed | BookFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<!-- Minimal nav — consistent with other auth pages -->
<nav class="navbar bf-navbar" aria-label="Site navigation">
    <div class="container">
        <a class="bf-brand" th:href="@{/}">
            <span class="bf-brand-icon" aria-hidden="true"><i class="bi bi-book-half"></i></span>
            BookFlow
        </a>
    </div>
</nav>

<main class="auth-page" id="main-content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-9 col-md-7 col-lg-5" style="max-width:420px;">

                <div class="bf-card">
                    <div class="bf-card-body text-center">

                        <!-- Error icon -->
                        <div class="bf-status-icon-error" aria-hidden="true">
                            <i class="bi bi-x-circle-fill"></i>
                        </div>

                        <h1 class="h5 fw-bold mb-2">Verification failed</h1>

                        <p class="text-muted mb-3" style="font-size:.9rem;"
                           th:text="${errorMessage} ?: 'This verification link is invalid or has expired.'">
                        </p>

                        <p class="text-muted mb-4" style="font-size:.82rem;line-height:1.6;">
                            Verification links are single-use and expire after 24 hours.
                            You can request a new link below.
                        </p>

                        <div class="d-grid gap-2">
                            <a th:href="@{/verify-pending}" class="btn btn-primary">
                                <i class="bi bi-envelope-arrow-up me-2" aria-hidden="true"></i>
                                Request a New Link
                            </a>
                            <a th:href="@{/register}" class="btn btn-outline-secondary">
                                <i class="bi bi-person-plus me-2" aria-hidden="true"></i>
                                Register Again
                            </a>
                            <a th:href="@{/login}" class="btn btn-link text-muted" style="font-size:.875rem;">
                                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
                                Back to Sign In
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<footer class="bf-footer bf-footer--compact" role="contentinfo">
    <div class="container">
        <div class="bf-footer-bottom" style="padding:.4rem 0;border-top:none;">
            <span>&copy; 2026 BookFlow</span>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
