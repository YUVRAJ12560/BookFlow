<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile | BookFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<!-- Minimal nav — one-time setup page, keep focus on the task -->
<nav class="navbar bf-navbar" aria-label="Site navigation">
    <div class="container">
        <a class="bf-brand" th:href="@{/}">
            <span class="bf-brand-icon" aria-hidden="true"><i class="bi bi-book-half"></i></span>
            BookFlow
        </a>
    </div>
</nav>

<main class="bf-complete-profile-page" id="main-content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <!-- Header -->
                <div class="text-center mb-4">
                    <div class="bf-verify-icon" aria-hidden="true">
                        <i class="bi bi-person-check"></i>
                    </div>
                    <h1 class="h4 fw-bold mb-1">One last step</h1>
                    <p class="text-muted" style="font-size:.875rem;max-width:320px;margin:0 auto;">
                        Tell us your current academic year and semester so we can personalise your experience.
                    </p>
                </div>

                <div class="bf-card">
                    <div class="bf-card-body">

                        <!-- Error alert -->
                        <div th:if="${profileError}"
                             class="alert alert-danger d-flex align-items-center gap-2 mb-3"
                             role="alert">
                            <i class="bi bi-exclamation-triangle-fill flex-shrink-0" aria-hidden="true"></i>
                            <span th:text="${profileError}"></span>
                        </div>

                        <!-- Verified email — read-only -->
                        <div class="mb-4">
                            <label class="form-label">College Email</label>
                            <div class="input-group">
                                <span class="input-group-text"
                                      style="border-right:none;border-radius:6px 0 0 6px;background:var(--bf-bg-canvas);">
                                    <i class="bi bi-envelope-check text-success" aria-hidden="true"></i>
                                </span>
                                <input type="email" class="form-control"
                                       style="border-left:none;border-radius:0 6px 6px 0;background:var(--bf-bg-canvas);"
                                       th:value="${user.email}"
                                       readonly
                                       aria-label="Your verified college email">
                            </div>
                            <div class="form-text">
                                <i class="bi bi-shield-check text-success me-1" aria-hidden="true"></i>
                                Verified college account
                            </div>
                        </div>

                        <!--
                            POST to /user/complete-profile
                            CSRF token injected automatically by Thymeleaf + Spring Security.
                        -->
                        <form th:action="@{/user/complete-profile}" method="post">

                            <div class="row g-3 mb-4">
                                <div class="col-6">
                                    <label for="year" class="form-label">
                                        Current Year <span class="text-danger" aria-label="required">*</span>
                                    </label>
                                    <select id="year" name="year" class="form-select"
                                            required aria-required="true">
                                        <option value="">-- Year --</option>
                                        <option value="1">Year 1</option>
                                        <option value="2">Year 2</option>
                                        <option value="3">Year 3</option>
                                        <option value="4">Year 4</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label for="semester" class="form-label">
                                        Semester <span class="text-danger" aria-label="required">*</span>
                                    </label>
                                    <select id="semester" name="semester" class="form-select"
                                            required aria-required="true">
                                        <option value="">-- Sem --</option>
                                        <option value="1">Sem 1</option>
                                        <option value="2">Sem 2</option>
                                        <option value="3">Sem 3</option>
                                        <option value="4">Sem 4</option>
                                        <option value="5">Sem 5</option>
                                        <option value="6">Sem 6</option>
                                        <option value="7">Sem 7</option>
                                        <option value="8">Sem 8</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-check2 me-1" aria-hidden="true"></i>
                                    Save and Continue
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

                <p class="text-center text-muted mt-3" style="font-size:.8rem;">
                    You can update these details from your profile at any time.
                </p>

            </div>
        </div>
    </div>
</main>

<footer class="bf-footer bf-footer--compact" role="contentinfo">
    <div class="container">
        <div class="bf-footer-bottom" style="padding:.4rem 0;border-top:none;">
            <span>&copy; 2026 BookFlow</span>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
