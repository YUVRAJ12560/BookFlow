<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | BookFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<!-- Full-page gradient background with centred card -->
<div class="bf-admin-login-bg">
    <div class="bf-admin-login-card">

        <!-- Dark top band -->
        <div class="bf-admin-login-top">
            <div class="icon"><i class="bi bi-shield-lock-fill"></i></div>
            <h1>BookFlow Admin</h1>
            <p>Restricted access — PVPP College of Engineering</p>
        </div>

        <!-- Form body -->
        <div class="bf-admin-login-body">

            <!-- Error: wrong credentials — th:if preserved exactly -->
            <div th:if="${param.error}"
                 class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                <span>Incorrect email or password.</span>
            </div>

            <!-- Error: not ADMIN role — th:if preserved exactly -->
            <div th:if="${param.error == 'forbidden'}"
                 class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
                <i class="bi bi-ban flex-shrink-0"></i>
                <span>This account does not have administrator access.</span>
            </div>

            <!-- Logout confirmation — th:if preserved exactly -->
            <div th:if="${param.logout}"
                 class="alert alert-info auto-dismiss d-flex align-items-center gap-2 mb-3" role="alert">
                <i class="bi bi-box-arrow-left flex-shrink-0"></i>
                <span>You have been logged out.</span>
            </div>

            <!-- Form — action /admin-login and field names preserved exactly -->
            <form th:action="@{/admin-login}" method="post">

                <div class="mb-3">
                    <label for="email" class="form-label">Admin Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"
                              style="border:1.5px solid #e2e8f0;border-right:none;border-radius:6px 0 0 6px;">
                            <i class="bi bi-envelope text-muted" style="font-size:.8rem;"></i>
                        </span>
                        <input type="email" id="email" name="email"
                               class="form-control border-start-0" style="border-left:none;"
                               placeholder="admin@pvppcoe.ac.in"
                               autocomplete="email" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"
                              style="border:1.5px solid #e2e8f0;border-right:none;border-radius:6px 0 0 6px;">
                            <i class="bi bi-lock text-muted" style="font-size:.8rem;"></i>
                        </span>
                        <input type="password" id="password" name="password"
                               class="form-control border-start-0" style="border-left:none;"
                               placeholder="••••••••"
                               autocomplete="current-password" required>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-shield-check me-2"></i>Sign In as Admin
                    </button>
                </div>

            </form>

            <p class="text-center mt-4 mb-0" style="font-size:.82rem;">
                <a th:href="@{/}" class="text-muted">
                    <i class="bi bi-arrow-left me-1"></i>Back to BookFlow
                </a>
            </p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmQ5R6BaOqDM/N7mOLGSMd/oG9iy" crossorigin="anonymous"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
