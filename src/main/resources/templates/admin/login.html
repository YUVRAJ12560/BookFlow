<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Sign In | BookFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<main id="main-content" class="adm-login-wrap">
  <div class="adm-login-card">

    <a th:href="@{/}" class="adm-login-logo" aria-label="BookFlow home">
      <span class="adm-login-logo__icon"><i class="bi bi-shield-lock"></i></span>
      BookFlow Admin
    </a>

    <h1 class="adm-login-title">Administrator Sign In</h1>
    <p class="adm-login-subtitle">Restricted access — authorised personnel only.</p>

    <!-- Error alerts -->
    <div th:if="${param.error}" class="alert alert-danger mb-3" role="alert">
      <i class="bi bi-exclamation-triangle-fill flex-shrink-0" aria-hidden="true"></i>
      <span>Incorrect email or password. Please try again.</span>
    </div>

    <form th:action="@{/admin-login}" method="post" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Admin Email</label>
        <input type="email" id="email" name="email"
               class="form-control"
               placeholder="admin@pvppcoe.ac.in"
               autocomplete="email" required aria-required="true">
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <div class="auth-pass-wrap">
          <input type="password" id="password" name="password"
                 class="form-control"
                 placeholder="Enter your password"
                 autocomplete="current-password" required aria-required="true">
          <button type="button" class="auth-pass-toggle"
                  aria-label="Show password" onclick="togglePass('password', this)">
            <i class="bi bi-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="adm-login-btn">
        <i class="bi bi-shield-lock me-1" aria-hidden="true"></i>
        Sign In to Admin Panel
      </button>
    </form>

    <div class="mt-4 text-center" style="font-size:.8125rem;color:rgba(255,255,255,.35);">
      Not an admin?
      <a th:href="@{/login}" style="color:rgba(255,255,255,.5);">Student sign-in &rarr;</a>
    </div>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script>
function togglePass(fieldId, btn) {
  var input = document.getElementById(fieldId);
  var icon  = btn.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'bi bi-eye-slash';
    btn.setAttribute('aria-label', 'Hide password');
  } else {
    input.type = 'password';
    icon.className = 'bi bi-eye';
    btn.setAttribute('aria-label', 'Show password');
  }
}
</script>
</body>
</html>
