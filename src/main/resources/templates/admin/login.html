<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | BookFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<!--
    Full-page dark background with centred card.
    bf-admin-login-bg, bf-admin-login-card, bf-admin-login-top,
    bf-admin-login-body are defined in main.css.
-->
<main class="bf-admin-login-bg" id="main-content">
    <div class="bf-admin-login-card" role="region" aria-label="Admin login">

        <!-- Dark top band with icon -->
        <div class="bf-admin-login-top">
            <div class="icon" aria-hidden="true">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h1>BookFlow Admin</h1>
            <p>Restricted access — administrators only</p>
        </div>

        <!-- Form body -->
        <div class="bf-admin-login-body">

            <!-- Wrong credentials error -->
            <div th:if="${param.error != null and param.error != 'forbidden'}"
                 class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0" aria-hidden="true"></i>
                <span>Incorrect email or password.</span>
            </div>

            <!-- Non-admin account error -->
            <div th:if="${param.error == 'forbidden'}"
                 class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
                <i class="bi bi-ban flex-shrink-0" aria-hidden="true"></i>
                <span>This account does not have administrator access.</span>
            </div>

            <!-- Logout confirmation -->
            <div th:if="${param.logout}"
                 class="alert alert-info auto-dismiss d-flex align-items-center gap-2 mb-3"
                 role="status" aria-live="polite">
                <i class="bi bi-box-arrow-left flex-shrink-0" aria-hidden="true"></i>
                <span>You have been signed out.</span>
            </div>

            <!--
                Form action /admin-login and field names preserved exactly.
                CSRF injected by Thymeleaf.
            -->
            <form th:action="@{/admin-login}" method="post" novalidate>

                <div class="mb-3">
                    <label for="email" class="form-label">Admin Email</label>
                    <div class="input-group">
                        <span class="input-group-text"
                              style="border-right:none;border-radius:6px 0 0 6px;background:var(--bf-bg-canvas);"
                              aria-hidden="true">
                            <i class="bi bi-envelope" style="font-size:.85rem;color:#94a3b8;"></i>
                        </span>
                        <input type="email" id="email" name="email"
                               class="form-control"
                               style="border-left:none;"
                               placeholder="admin@college.edu"
                               autocomplete="email"
                               required
                               aria-required="true">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"
                              style="border-right:none;border-radius:6px 0 0 6px;background:var(--bf-bg-canvas);"
                              aria-hidden="true">
                            <i class="bi bi-lock" style="font-size:.85rem;color:#94a3b8;"></i>
                        </span>
                        <input type="password" id="password" name="password"
                               class="form-control"
                               style="border-left:none;"
                               placeholder="••••••••"
                               autocomplete="current-password"
                               required
                               aria-required="true">
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-shield-check me-2" aria-hidden="true"></i>Sign In as Admin
                    </button>
                </div>

            </form>

            <p class="text-center mt-4 mb-0" style="font-size:.82rem;">
                <a th:href="@{/}" class="text-muted" style="text-decoration:none;">
                    <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back to BookFlow
                </a>
            </p>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
