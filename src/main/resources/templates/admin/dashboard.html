<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | BookFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<!-- ── Admin Navbar ─────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg bf-navbar bf-topbar">
    <div class="container-fluid px-4">
        <a class="bf-brand" th:href="@{/admin/dashboard}">
            <span class="bf-brand-icon"><i class="bi bi-book-half"></i></span>
            BookFlow
            <span class="bf-admin-badge ms-2">Admin</span>
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navAdmin"
                aria-controls="navAdmin" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navAdmin">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-3">
                <li class="nav-item">
                    <a class="bf-nav-link active" th:href="@{/admin/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="bf-nav-link" th:href="@{/admin/resources/pending}">
                        <i class="bi bi-hourglass-split me-1"></i>Pending Resources
                        <span th:if="${pendingCount > 0}"
                              class="badge bf-badge-pending ms-1"
                              th:text="${pendingCount}"></span>
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                <li class="nav-item dropdown">
                    <a class="bf-user-trigger dropdown-toggle" href="#"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <span class="bf-avatar"
                              th:text="${#strings.substring(admin.name,0,1).toUpperCase()}">A</span>
                        <span th:text="${admin.name}">Admin</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <!-- admin-logout action preserved exactly -->
                            <form th:action="@{/admin-logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ── Dashboard header ─────────────────────────────────────── -->
<div class="bf-dash-header">
    <div class="container-fluid px-4">
        <h1 class="h4 fw-bold mb-0">Admin Dashboard</h1>
        <p class="text-muted mb-0 mt-1" style="font-size:.85rem;">
            Logged in as <strong th:text="${admin.email}">admin@pvppcoe.ac.in</strong>
        </p>
    </div>
</div>

<!-- ── Main ─────────────────────────────────────────────────── -->
<main style="padding:1.5rem 0 2.5rem;">
    <div class="container-fluid px-4">

        <p class="bf-section-label mb-3">Overview</p>

        <div class="row g-3 mb-4">

            <!-- Pending count stat card — th:text preserved exactly -->
            <div class="col-sm-6 col-lg-3">
                <div class="bf-stat-card">
                    <div class="bf-stat-icon bf-stat-icon-amber">
                        <i class="bi bi-hourglass-split"></i>
                    </div>
                    <div>
                        <div class="bf-stat-value" th:text="${pendingCount}">0</div>
                        <div class="bf-stat-label">Pending Review</div>
                    </div>
                </div>
            </div>

        </div>

        <p class="bf-section-label mb-3">Quick Actions</p>

        <div class="row g-3">
            <div class="col-sm-6 col-lg-4">
                <div class="bf-action-card">
                    <div class="bf-action-icon bf-icon-orange">
                        <i class="bi bi-clipboard-check"></i>
                    </div>
                    <h6 class="bf-feature-tile-title mb-1">Review Pending Resources</h6>
                    <p class="bf-feature-tile-body mb-3">
                        Approve or reject resources submitted by students.
                    </p>
                    <a th:href="@{/admin/resources/pending}" class="btn btn-primary btn-sm">
                        <i class="bi bi-arrow-right me-1"></i>
                        Review
                        <span th:if="${pendingCount > 0}"
                              class="badge bf-badge-pending ms-1"
                              th:text="${pendingCount}"></span>
                    </a>
                </div>
            </div>
        </div>

    </div>
</main>

<footer class="bf-footer">
    <div class="container text-center">&copy; 2026 BookFlow &mdash; PVPP College of Engineering</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmQ5R6BaOqDM/N7mOLGSMd/oG9iy" crossorigin="anonymous"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
